<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M5Stack 環境モニタ</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", "Yu Gothic", sans-serif;
            background-color: #f4f4f2;
            color: #1a1a1a;
            margin: 0;
            padding: 16px;
            max-width: 600px;
        }

        /* 上部コントロールバー */
        .header-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-bottom: 12px;
            margin-bottom: 16px;
            border-bottom: 1px solid #d4d4d0;
        }

        button {
            background-color: #1a1a1a;
            color: #ffffff;
            border: none;
            padding: 8px 16px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
        }

        button:active {
            background-color: #444;
        }

        .status-wrap {
            display: inline-flex;
            align-items: center;
            font-size: 14px;
            font-weight: bold;
        }

        .led {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            margin-right: 6px;
        }
        .led-off   { background-color: #a0a09c; }
        .led-green { background-color: #00a846; }
        .led-red   { background-color: #d00000; }

        /* 数値表示グリッド */
        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-bottom: 16px;
        }

        /* スマホ縦画面で幅が狭い場合は縦積みにする */
        @media (max-width: 480px) {
            .metrics-grid {
                grid-template-columns: 1fr;
            }
        }

        .metric-box {
            background-color: #ffffff;
            border: 1px solid #dcdcd8;
            border-left-width: 5px; /* 左側のアクセントカラー */
            padding: 12px 14px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* 項目ごとのアクセントカラーとごく薄い背景色 */
        .metric-temp {
            border-left-color: #c62828;
            background-color: #fdfafa;
        }
        .metric-hum {
            border-left-color: #1565c0;
            background-color: #fafcfd;
        }
        .metric-press {
            border-left-color: #2e7d32;
            background-color: #fafcfa;
        }

        .metric-label {
            font-size: 12px;
            font-weight: bold;
            color: #555552;
            letter-spacing: 0.05em;
            margin-bottom: 4px;
        }

        .metric-value-row {
            display: flex;
            align-items: baseline;
            gap: 4px;
        }

        .metric-value {
            font-size: 36px;
            font-weight: 700;
            line-height: 1.1;
            font-variant-numeric: tabular-nums; /* 数字の横幅を揃えてガタつき防止 */
            color: #111111;
        }

        .metric-unit {
            font-size: 14px;
            font-weight: bold;
            color: #555552;
        }

        /* グラフ枠 */
        .chart-container {
            background-color: #ffffff;
            border: 1px solid #dcdcd8;
            padding: 12px;
            height: 250px;
        }
    </style>
</head>
<body>
    <div class="header-bar">
        <button id="connectBtn">M5Stackに接続</button>
        <span class="status-wrap">
            <span id="led" class="led led-off"></span>
            <span id="statusText">切断</span>
        </span>
    </div>
    
    <div class="metrics-grid">
        <div class="metric-box metric-temp">
            <span class="metric-label">温度 / TEMP</span>
            <div class="metric-value-row">
                <span id="temp" class="metric-value">--</span>
                <span class="metric-unit">℃</span>
            </div>
        </div>

        <div class="metric-box metric-hum">
            <span class="metric-label">湿度 / HUM</span>
            <div class="metric-value-row">
                <span id="hum" class="metric-value">--</span>
                <span class="metric-unit">%</span>
            </div>
        </div>

        <div class="metric-box metric-press">
            <span class="metric-label">気圧 / PRESS</span>
            <div class="metric-value-row">
                <span id="press" class="metric-value">--</span>
                <span class="metric-unit">hPa</span>
            </div>
        </div>
    </div>

    <div class="chart-container">
        <canvas id="envChart"></canvas>
    </div>

    <script>
        const SERVICE_UUID = '25264dce-a813-1620-a146-8098e419033b';
        const SENSOR_CHAR_UUID = '5cda93eb-a611-c588-812d-6e5677223ac8';

        const connectBtn = document.getElementById('connectBtn');
        const ledEl = document.getElementById('led');
        const statusTextEl = document.getElementById('statusText');
        let bluetoothDevice = null;

        // --- Chart.js 設定 ---
        const MAX_DATA_POINTS = 30;
        const GRAPH_INTERVAL_MS = 10000; // 10秒ごとにプロット
        let lastChartUpdate = 0;

        const ctx = document.getElementById('envChart').getContext('2d');
        const envChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: [],
                datasets: [
                    {
                        label: '温度 (℃)',
                        data: [],
                        borderColor: '#c62828',
                        backgroundColor: 'rgba(198, 40, 40, 0.08)',
                        yAxisID: 'y',
                        tension: 0.1,
                        borderWidth: 2,
                        pointRadius: 2
                    },
                    {
                        label: '湿度 (%)',
                        data: [],
                        borderColor: '#1565c0',
                        backgroundColor: 'rgba(21, 101, 192, 0.08)',
                        yAxisID: 'y1',
                        tension: 0.1,
                        borderWidth: 2,
                        pointRadius: 2
                    }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                animation: false,
                scales: {
                    y: {
                        type: 'linear',
                        position: 'left',
                        title: { display: true, text: '℃' }
                    },
                    y1: {
                        type: 'linear',
                        position: 'right',
                        grid: { drawOnChartArea: false },
                        title: { display: true, text: '%' }
                    }
                }
            }
        });

        function adjustScaleRange(axisId, dataArray, minSpan) {
            const minVal = Math.min(...dataArray);
            const maxVal = Math.max(...dataArray);
            const currentSpan = maxVal - minVal;

            if (currentSpan < minSpan) {
                const center = (maxVal + minVal) / 2;
                envChart.options.scales[axisId].min = Math.floor(center - minSpan / 2);
                envChart.options.scales[axisId].max = Math.ceil(center + minSpan / 2);
            } else {
                delete envChart.options.scales[axisId].min;
                delete envChart.options.scales[axisId].max;
            }
        }

        function updateChart(temp, hum) {
            const now = new Date();
            const timeLabel = now.toTimeString().split(' ')[0];

            envChart.data.labels.push(timeLabel);
            envChart.data.datasets[0].data.push(temp);
            envChart.data.datasets[1].data.push(hum);

            if (envChart.data.labels.length > MAX_DATA_POINTS) {
                envChart.data.labels.shift();
                envChart.data.datasets[0].data.shift();
                envChart.data.datasets[1].data.shift();
            }

            adjustScaleRange('y', envChart.data.datasets[0].data, 10);
            adjustScaleRange('y1', envChart.data.datasets[1].data, 20);

            envChart.update();
        }
        // --------------------

        function setStatus(ledClass, text) {
            ledEl.className = 'led ' + ledClass;
            statusTextEl.textContent = text;
        }

        function onDisconnected() {
            setStatus('led-off', '切断');
            connectBtn.textContent = 'M5Stackに接続';
            document.getElementById('temp').textContent = '--';
            document.getElementById('hum').textContent = '--';
            document.getElementById('press').textContent = '--';
            bluetoothDevice = null;
        }

        connectBtn.addEventListener('click', async () => {
            if (bluetoothDevice && bluetoothDevice.gatt.connected) {
                bluetoothDevice.gatt.disconnect();
                return;
            }

            try {
                bluetoothDevice = await navigator.bluetooth.requestDevice({
                    filters: [{ name: 'M5_EnvKey' }],
                    optionalServices: [SERVICE_UUID]
                });

                bluetoothDevice.addEventListener('gattserverdisconnected', onDisconnected);

                const server = await bluetoothDevice.gatt.connect();
                const service = await server.getPrimaryService(SERVICE_UUID);
                const characteristic = await service.getCharacteristic(SENSOR_CHAR_UUID);

                await characteristic.startNotifications();
                
                characteristic.addEventListener('characteristicvaluechanged', (event) => {
                    const jsonString = new TextDecoder().decode(event.target.value);
                    const data = JSON.parse(jsonString);
                    
                    // 小数点第1位までに揃えて表示（桁数変化によるガタつき防止）
                    document.getElementById('temp').textContent = Number(data.t).toFixed(1);
                    document.getElementById('hum').textContent = Number(data.h).toFixed(1);
                    document.getElementById('press').textContent = Number(data.p).toFixed(1);

                    const now = Date.now();
                    if (now - lastChartUpdate >= GRAPH_INTERVAL_MS) {
                        updateChart(data.t, data.h);
                        lastChartUpdate = now;
                    }
                });
                
                setStatus('led-green', '接続中');
                connectBtn.textContent = '切断する';
                
            } catch (error) {
                console.error(error);
                setStatus('led-red', '切断');
                bluetoothDevice = null;
            }
        });
    </script>
</body>
</html>
