<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M5Stack 温度計</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        .status-wrap {
            display: inline-flex;
            align-items: center;
            margin-left: 10px;
            color: #000;
        }
        .led {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            margin-right: 6px;
        }
        .led-off   { background-color: #bbb; }
        .led-green { background-color: #00c853; }
        .led-red   { background-color: #d50000; }

        .settings {
            margin-top: 15px;
            font-size: 14px;
        }
        .settings label {
            margin-right: 12px;
        }
        .settings input {
            width: 55px;
        }

        .chart-container {
            width: 100%;
            max-width: 600px;
            height: 260px;
            margin-top: 15px;
        }
    </style>
</head>
<body>
    <div>
        <button id="connectBtn">M5Stackに接続</button>
        <span class="status-wrap">
            <span id="led" class="led led-off"></span>
            <span id="statusText">切断</span>
        </span>
    </div>
    
    <p>温度: <span id="temp">--</span> ℃</p>
    <p>湿度: <span id="hum">--</span> %</p>
    <p>気圧: <span id="press">--</span> hPa</p>

    <!-- グラフ設定用の入力欄 -->
    <div class="settings">
        <label>更新間隔: <input type="number" id="intervalInput" value="5" min="1"> 秒</label>
        <label>最大点数: <input type="number" id="maxPointsInput" value="30" min="2" max="500"> 点</label>
    </div>

    <div class="chart-container">
        <canvas id="envChart"></canvas>
    </div>

    <script>
        const SERVICE_UUID = '25264dce-a813-1620-a146-8098e419033b';
        const SENSOR_CHAR_UUID = '5cda93eb-a611-c588-812d-6e5677223ac8';

        const connectBtn = document.getElementById('connectBtn');
        const ledEl = document.getElementById('led');
        const statusTextEl = document.getElementById('statusText');
        const intervalInput = document.getElementById('intervalInput');
        const maxPointsInput = document.getElementById('maxPointsInput');

        let bluetoothDevice = null;
        let lastChartUpdate = 0;

        // 入力欄から現在の設定値を取得する関数（不正な値対策のデフォルト値付き）
        function getGraphIntervalMs() {
            const sec = parseInt(intervalInput.value, 10);
            return (isNaN(sec) || sec < 1 ? 1 : sec) * 1000;
        }

        function getMaxDataPoints() {
            const pts = parseInt(maxPointsInput.value, 10);
            return isNaN(pts) || pts < 2 ? 2 : pts;
        }

        // --- Chart.js の初期設定 ---
        const ctx = document.getElementById('envChart').getContext('2d');
        const envChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: [],
                datasets: [
                    {
                        label: '温度 (℃)',
                        data: [],
                        borderColor: '#e53935',
                        backgroundColor: 'rgba(229, 57, 53, 0.1)',
                        yAxisID: 'y',
                        tension: 0.2,
                        pointRadius: 2
                    },
                    {
                        label: '湿度 (%)',
                        data: [],
                        borderColor: '#1e88e5',
                        backgroundColor: 'rgba(30, 136, 229, 0.1)',
                        yAxisID: 'y1',
                        tension: 0.2,
                        pointRadius: 2
                    }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                animation: false,
                scales: {
                    y: {
                        type: 'linear',
                        position: 'left',
                        title: { display: true, text: '℃' }
                    },
                    y1: {
                        type: 'linear',
                        position: 'right',
                        grid: { drawOnChartArea: false },
                        title: { display: true, text: '%' }
                    }
                }
            }
        });

        // 軸の最低表示幅を確保する補助関数
        function adjustScaleRange(axisId, dataArray, minSpan) {
            if (dataArray.length === 0) return;
            const minVal = Math.min(...dataArray);
            const maxVal = Math.max(...dataArray);
            const currentSpan = maxVal - minVal;

            if (currentSpan < minSpan) {
                const center = (maxVal + minVal) / 2;
                envChart.options.scales[axisId].min = Math.floor(center - minSpan / 2);
                envChart.options.scales[axisId].max = Math.ceil(center + minSpan / 2);
            } else {
                delete envChart.options.scales[axisId].min;
                delete envChart.options.scales[axisId].max;
            }
        }

        // 最大点数を超えた古いデータを削除する関数
        function trimChartData() {
            const maxPoints = getMaxDataPoints();
            while (envChart.data.labels.length > maxPoints) {
                envChart.data.labels.shift();
                envChart.data.datasets[0].data.shift();
                envChart.data.datasets[1].data.shift();
            }
        }

        // 最大点数の入力値が変更されたら即座にグラフへ反映
        maxPointsInput.addEventListener('change', () => {
            trimChartData();
            adjustScaleRange('y', envChart.data.datasets[0].data, 10);
            adjustScaleRange('y1', envChart.data.datasets[1].data, 20);
            envChart.update();
        });

        function updateChart(temp, hum) {
            const now = new Date();
            const timeLabel = now.toTimeString().split(' ')[0];

            envChart.data.labels.push(timeLabel);
            envChart.data.datasets[0].data.push(temp);
            envChart.data.datasets[1].data.push(hum);

            trimChartData();

            adjustScaleRange('y', envChart.data.datasets[0].data, 10);
            adjustScaleRange('y1', envChart.data.datasets[1].data, 20);

            envChart.update();
        }
        // ---------------------------

        function setStatus(ledClass, text) {
            ledEl.className = 'led ' + ledClass;
            statusTextEl.textContent = text;
        }

        function onDisconnected() {
            setStatus('led-off', '切断');
            connectBtn.textContent = 'M5Stackに接続';
            document.getElementById('temp').textContent = '--';
            document.getElementById('hum').textContent = '--';
            document.getElementById('press').textContent = '--';
            bluetoothDevice = null;
        }

        connectBtn.addEventListener('click', async () => {
            if (bluetoothDevice && bluetoothDevice.gatt.connected) {
                bluetoothDevice.gatt.disconnect();
                return;
            }

            try {
                bluetoothDevice = await navigator.bluetooth.requestDevice({
                    filters: [{ name: 'M5_EnvKey' }],
                    optionalServices: [SERVICE_UUID]
                });

                bluetoothDevice.addEventListener('gattserverdisconnected', onDisconnected);

                const server = await bluetoothDevice.gatt.connect();
                const service = await server.getPrimaryService(SERVICE_UUID);
                const characteristic = await service.getCharacteristic(SENSOR_CHAR_UUID);

                await characteristic.startNotifications();
                
                // 再接続時にすぐ1点目が描画されるようリセット
                lastChartUpdate = 0;

                characteristic.addEventListener('characteristicvaluechanged', (event) => {
                    const jsonString = new TextDecoder().decode(event.target.value);
                    const data = JSON.parse(jsonString);
                    
                    document.getElementById('temp').textContent = data.t;
                    document.getElementById('hum').textContent = data.h;
                    document.getElementById('press').textContent = data.p;

                    const now = Date.now();
                    if (now - lastChartUpdate >= getGraphIntervalMs()) {
                        updateChart(data.t, data.h);
                        lastChartUpdate = now;
                    }
                });
                
                setStatus('led-green', '接続中');
                connectBtn.textContent = '切断する';
                
            } catch (error) {
                console.error(error);
                setStatus('led-red', '切断');
                bluetoothDevice = null;
            }
        });
    </script>
</body>
</html>
